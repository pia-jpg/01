<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Spatial Parallax – 3 Layer</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #1a1a2e;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  perspective: 1000px;
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
}

.postcard {
  width: min(90vw, 400px);
  aspect-ratio: 2 / 3;
  position: relative;
  transform-style: preserve-3d;
  border-radius: 8px;
  overflow: hidden;
}

/* Allgemeine Layer-Regeln */
.layer {
  position: absolute;
  inset: -20%;
  background-size: cover;
  background-position: center;
  will-change: transform;
}

/* Hintergrund */
.layer-1 {
  background-image: url("layer1.png");
  z-index: 1;
}

/* Mittelgrund */
.layer-2 {
  background-image: url("layer2.png");
  z-index: 2;
}

/* Vordergrund – ANKER */
.layer-3 {
  background-image: url("layer3.png");
  z-index: 3;
}
</style>
</head>

<body>

<div class="postcard" id="scene">
  <div class="layer layer-1" data-depth="-0.4"></div>
  <div class="layer layer-2" data-depth="-0.2"></div>
  <div class="layer layer-3" data-depth="0"></div>
</div>

<script>
const scene = document.getElementById("scene");
const layers = document.querySelectorAll(".layer");

let targetX = 0;
let targetY = 0;
let currentX = 0;
let currentY = 0;

/* Apple-ähnliche Parameter */
const SMOOTHING = 0.25;
const MAX_ROTATION = 5;   // Grad
const MAX_TRANSLATE = 14; // Pixel

/* Nicht-lineares Mapping */
function ease(v) {
  return Math.sign(v) * Math.pow(Math.abs(v), 0.75);
}

/* Render Loop */
function animate() {
  currentX += (targetX - currentX) * SMOOTHING;
  currentY += (targetY - currentY) * SMOOTHING;

  scene.style.transform = `
    rotateY(${currentX * MAX_ROTATION}deg)
    rotateX(${-currentY * MAX_ROTATION}deg)
  `;

  layers.forEach(layer => {
    const depth = parseFloat(layer.dataset.depth);
    const x = currentX * MAX_TRANSLATE * depth;
    const y = currentY * MAX_TRANSLATE * depth;

    layer.style.transform = `
      translate3d(${-x}px, ${-y}px, ${depth * 30}px)
    `;
  });

  requestAnimationFrame(animate);
}

animate();

/* Maussteuerung (Desktop) */
document.addEventListener("mousemove", e => {
  const rect = scene.getBoundingClientRect();
  const x = (e.clientX - rect.left - rect.width / 2) / (rect.width / 2);
  const y = (e.clientY - rect.top - rect.height / 2) / (rect.height / 2);

  targetX = ease(Math.max(-1, Math.min(1, x)));
  targetY = ease(Math.max(-1, Math.min(1, y)));
});

document.addEventListener("mouseleave", () => {
  targetX = 0;
  targetY = 0;
});

/* Gyro (Mobile) */
if (window.DeviceOrientationEvent) {
  if (typeof DeviceOrientationEvent.requestPermission === "function") {
    DeviceOrientationEvent.requestPermission().then(p => {
      if (p === "granted") startGyro();
    });
  } else {
    startGyro();
  }
}

function startGyro() {
  window.addEventListener("deviceorientation", e => {
    targetX = ease(Math.max(-1, Math.min(1, (e.gamma || 0) / 45)));
    targetY = ease(Math.max(-1, Math.min(1, (e.beta || 0) / 45)));
  });
}
</script>

</body>
</html>
